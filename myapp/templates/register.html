{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; padding: 24px; background-color: #1f1f1f; border-radius: 12px; border: 1px solid #333;">
    <h2 style="margin-bottom: 20px; text-align: center;">Регистрация</h2>

    {% if error %}
        <div style="background-color: #5a1a1a; color: #ff8888; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; font-size: 14px; color: #aaa;">Имя пользователя</label>
            <input type="text" name="username" required style="width: 100%; padding: 10px; background-color: #121212; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none;">
        </div>

        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; font-size: 14px; color: #aaa;">Пароль</label>
            <input type="password" name="password" required style="width: 100%; padding: 10px; background-color: #121212; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 6px; font-size: 14px; color: #aaa;">Подтверждение пароля</label>
            <input type="password" name="password_confirm" required style="width: 100%; padding: 10px; background-color: #121212; border: 1px solid #333; border-radius: 8px; color: #fff; outline: none;">
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background-color: #3ea6ff; border: none; border-radius: 20px; color: #0f0f0f; font-weight: bold; cursor: pointer;">
            Зарегистрироваться
        </button>
    </form>

    <p style="margin-top: 16px; text-align: center; font-size: 14px; color: #aaa;">
        Уже есть аккаунт? <a href="{% url 'login' %}" style="color: #3ea6ff; text-decoration: none;">Войти</a>
    </p>
</div>
{% endblock %}
