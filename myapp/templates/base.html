<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеоплатформа</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f0f; color: #fff; }

        /* Верхняя навигация */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background-color: #0f0f0f; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #272727; }
        .logo a { color: #ff0000; font-size: 22px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .search-box { display: flex; width: 40%; }
        .search-box input { width: 100%; padding: 8px 16px; background-color: #121212; border: 1px solid #303030; border-radius: 20px 0 0 20px; color: #fff; outline: none; }
        .search-box button { padding: 8px 16px; background-color: #222222; border: 1px solid #303030; border-left: none; border-radius: 0 20px 20px 0; color: #fff; cursor: pointer; }
        .user-nav { display: flex; gap: 12px; align-items: center; }
        .user-nav a { color: #fff; text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 18px; background-color: #272727; }
        .user-nav a.btn-primary { background-color: #3ea6ff; color: #0f0f0f; font-weight: 600; }

        /* Контейнер макета */
        .layout-container { display: flex; min-height: calc(100vh - 57px); }
        .main-content { flex: 1; padding: 20px; }

        /* Сетка карточек видео */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { background: transparent; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .thumbnail-box { width: 100%; aspect-ratio: 16/9; background-color: #272727; border-radius: 12px; overflow: hidden; position: relative; }
        .thumbnail-box img { width: 100%; height: 100%; object-fit: cover; }
        .video-info { display: flex; gap: 12px; margin-top: 12px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background-color: #444; flex-shrink: 0; }
        .video-details h3 { font-size: 15px; font-weight: 600; line-height: 1.2; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-details p { font-size: 13px; color: #aaa; margin-top: 2px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="{% url 'index' %}">▶ VideoPlatform</a>
        </div>

        <form class="search-box" method="GET" action="{% url 'index' %}">
            <input type="text" name="q" placeholder="Поиск видео..." value="{{ request.GET.q }}">
            <button type="submit">🔍</button>
        </form>

        <nav class="user-nav">
            {% if user.is_authenticated %}
                <a href="{% url 'create_channel' %}">+ Канал</a>
                <a href="{% url 'upload_video' %}">+ Видео</a>
                <a href="{% url 'user_profile' user.username %}">👤 {{ user.username }}</a>
                <a href="{% url 'logout' %}">Выйти</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn-primary">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <div class="layout-container">
        {% block main_layout %}
            <div class="main-content">
                {% block content %}{% endblock %}
            </div>
        {% endblock %}
    </div>
</body>
</html>
